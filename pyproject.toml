[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "pygame==2.6.1",
    "beautifulsoup4==4.15.0",
    "requests==2.34.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sudoku = ["resources/*.txt"]